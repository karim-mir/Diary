<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>{% block title %}Мой дневник{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="{% url 'diary:entry_list' %}">Мой дневник</a>
    <div>
      {% if user.is_authenticated %}
        <a class="btn btn-outline-primary me-2" href="{% url 'diary:entry_create' %}">Новая запись</a>
        <a class="btn btn-outline-danger" href="{% url 'logout' %}">Выйти</a>
      {% else %}
        <a class="btn btn-outline-success" href="{% url 'login' %}">Войти</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
