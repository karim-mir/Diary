<nav class="d-flex flex-column bg-dark text-white vh-100 p-3" style="width: 250px;">

    <!-- Верхняя часть меню -->
    <div class="menu-title d-flex align-items-center mb-3">
        <i class="fas fa-bars me-2"></i>
        <span>Меню</span>
    </div>

    <div class="nav flex-column mb-auto">
        <a class="nav-link text-white" href="{% url 'diary:base' %}">Главная</a>
        <a class="nav-link text-white" href="{% url 'diary:entry_list' %}">Записи</a>
    </div>

    <!-- Нижняя часть меню - кнопки аутентификации и регистрации -->
    <div class="mt-auto">
        {% if user.is_authenticated %}
        <a class="btn btn-outline-light w-100 mb-2" href="{% url 'diary:entry_create' %}">Новая запись</a>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light w-100">Выйти</button>
        </form>
        {% else %}
        <a class="btn btn-outline-light w-100 mb-2" href="{% url 'login' %}?next={{ request.path }}">Войти</a>
        <a class="btn btn-outline-light w-100"
           class="btn btn-outline-light w-100" href="{% url 'users:register' %}?next={{ request.path }}">Зарегистрироваться</a>
        {% endif %}
    </div>
</nav>
