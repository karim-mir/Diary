<nav class="d-flex flex-column bg-light vh-100 p-3" style="width: 250px;">
  <div class="menu-title d-flex align-items-center mb-3">
    <i class="fas fa-bars me-2"></i>
    <span>Меню</span>
  </div>
  <div class="nav flex-column mb-auto">
    <a class="nav-link active" href="{% url 'diary:base' %}">Главная</a>
    <a class="nav-link" href="{% url 'diary:entry_list' %}">Записи</a>
  </div>

  <!-- Здесь блок кнопок вход/выход -->
  <div class="mt-3">
    {% if user.is_authenticated %}
      <a class="btn btn-outline-primary w-100 mb-2" href="{% url 'diary:entry_create' %}">Новая запись</a>

      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-danger w-100">Выйти</button>
      </form>
    {% else %}
      <a class="btn btn-outline-success w-100" href="{% url 'login' %}?next={{ request.path }}">Войти</a>
    {% endif %}
  </div>

  <div class="dropdown mt-auto">
    <button class="btn btn-link dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
      Пользователь
    </button>
    <ul class="dropdown-menu" aria-labelledby="userDropdown">
      <li><a class="dropdown-item" href="#">Профиль</a></li>
    </ul>
  </div>
</nav>
